<meta name="theme-color" content="#174C3D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Noor Tasbih">

<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF8F2;--ink:#2f3d35;--card:#fff;--ac:#174C3D;--acx:#fff;--sage:#A8BBA8;--pale:#E4ECE2;--beige:#EDE7DA;--mut:#77847A;--sh:0 6px 22px #174c3d14;--h0:#E9EFE6;--h1:#C9D8C6;--h2:#8FAF8F;--h3:#174C3D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="dark"]{--bg:#14201b;--ink:#E4ECE2;--card:#1d2c26;--ac:#A8BBA8;--acx:#14201b;--pale:#26382f;--beige:#26382f;--mut:#8fa094;--sh:0 6px 22px #0006;--h0:#24352d;--h1:#35574a;--h2:#5b8a74;--h3:#A8BBA8}
*{box-sizing:inherit}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));min-height:100vh;transition:background .3s}
h2{font-family:'Playfair Display',serif;font-weight:600;margin:.3em 0 .6em}
.ar{font-family:Amiri,'Noto Naskh Arabic',serif;direction:rtl;line-height:1.9}
main{max-width:560px;margin:0 auto;padding:12px 18px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:var(--card);box-shadow:0 -4px 20px #174c3d0f;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:120px;background:none;border:0;color:var(--mut);padding:6px 2px;font:inherit;font-size:11px;cursor:pointer;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac);font-weight:600;background:var(--pale)}
button:focus-visible,input:focus-visible,select:focus-visible,#zone:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:99px;padding:9px 18px;font:inherit;cursor:pointer}
.btn.o{background:var(--pale);color:var(--ink)}
.chip,.lnk{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:6px 10px;border-radius:99px}
.lnk:hover{color:var(--ac)}
.pill{appearance:none;background:var(--pale);color:var(--ink);border:0;border-radius:99px;padding:6px 14px;font:inherit;text-align:center;cursor:pointer;max-width:90%}
.pill.sm{font-size:13px;color:var(--mut)}
#zone{min-height:calc(100vh - 100px - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tr{color:var(--mut);font-style:italic;font-size:14px}.en{font-size:14px}
.ringw{position:relative;width:min(74vw,300px);aspect-ratio:1;margin:10px 0}
.ringw svg{width:100%;height:100%}.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#rg{transition:stroke-dashoffset .45s ease}
.num{font-family:'Playfair Display',serif;font-size:68px;line-height:1;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{max-width:320px;text-align:center}
input[type=number],input[type=text]{background:var(--bg);color:var(--ink);border:1px solid var(--pale);border-radius:12px;padding:9px 12px;font:inherit;width:100%}
.hmw{overflow-x:auto;padding:4px 0 10px}.hm{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;width:max-content}
.hm i{border-radius:4px;background:var(--h0)}.hm .e{background:none}.hm .h1{background:var(--h1)}.hm .h2{background:var(--h2)}.hm .h3{background:var(--h3)}.hm .f{opacity:.35}.hm .t{outline:1.5px solid var(--mut);outline-offset:1px}
.leg{display:inline-flex;gap:3px;vertical-align:middle}.leg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.th{display:flex;gap:12px}.th button{flex:1;border:2px solid transparent;background:var(--card);box-shadow:var(--sh);border-radius:18px;padding:18px 8px;color:var(--ink);font:inherit;cursor:pointer}.th button.on{border-color:var(--sage)}
.sw{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 8px;border:1px solid var(--sage)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<main id="app"></main><div id="md"></div>
<nav id="nav"></nav>
<script>
const D=[
{id:'sub',n:'SubhanAllah',ar:'سُبْحَانَ اللّٰهِ',tr:'Subḥān Allāh',en:'Glory be to Allah',t:33,src:'Post-prayer dhikr: Sahih Muslim 595, 597',f:'Reported: saying SubhanAllah, Alhamdulillah and Allahu Akbar 33 times each after every prayer, then completing 100 with La ilaha illallah, results in forgiveness of sins even if like the sea’s foam (Sahih Muslim 597).'},
{id:'ham',n:'Alhamdulillah',ar:'الْحَمْدُ لِلّٰهِ',tr:'Al-ḥamdu lillāh',en:'All praise is for Allah',t:33,src:'Post-prayer dhikr: Sahih Muslim 595, 597',f:'Part of the narrated 33-33-33 post-prayer sequence (Sahih Muslim).'},
{id:'akb',n:'Allahu Akbar',ar:'اللّٰهُ أَكْبَرُ',tr:'Allāhu akbar',en:'Allah is the Greatest',t:33,src:'Post-prayer dhikr: Sahih Muslim 595, 597',f:'Part of the narrated 33-33-33 post-prayer sequence (Sahih Muslim). Note: Sahih Muslim 597 narrates 33, 33 and 34 for Allahu Akbar in some wording.'},
{id:'ast',n:'Astaghfirullah',ar:'أَسْتَغْفِرُ اللّٰهَ',tr:'Astaghfirullāh',en:'I seek forgiveness from Allah',t:100,src:'Sahih al-Bukhari 6307',f:'Narrated: the Prophet ﷺ sought Allah’s forgiveness more than seventy times a day (Bukhari 6307). Your target here is your own choice, not a prescribed count.'},
{id:'lai',n:'La ilaha illallah',ar:'لَا إِلٰهَ إِلَّا اللّٰهُ',tr:'Lā ilāha illā Allāh',en:'There is no god but Allah',t:100,src:'Jami‘ at-Tirmidhi 3383 (hasan)',f:'Narrated as the best dhikr (Tirmidhi 3383, graded hasan). No fixed count is narrated here; 100 is a suggested target.'},
{id:'sbh',n:'SubhanAllahi wa bihamdihi',ar:'سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ',tr:'Subḥān Allāhi wa bi-ḥamdih',en:'Glory and praise be to Allah',t:100,src:'Bukhari 6405, Muslim 2691',f:'Narrated: whoever says it 100 times in a day, his sins are forgiven even if like the foam of the sea (Bukhari 6405, Muslim 2691).'},
{id:'haw',n:'La hawla wa la quwwata illa billah',ar:'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ',tr:'Lā ḥawla wa lā quwwata illā billāh',en:'There is no power and no strength except with Allah',t:100,src:'Bukhari 6384, Muslim 2704',f:'Narrated as a treasure from the treasures of Paradise (Bukhari 6384, Muslim 2704). No fixed count; 100 is a suggested target.'},
{id:'sal',n:'Salawat upon the Prophet ﷺ',ar:'اللّٰهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ',tr:'Allāhumma ṣalli ‘alā Muḥammad',en:'O Allah, send blessings upon Muhammad',t:100,src:'Quran 33:56; Sahih Muslim 408',f:'Allah commands believers to send blessings upon the Prophet ﷺ (Quran 33:56). Narrated: whoever sends one blessing, Allah sends ten upon him (Muslim 408). No fixed count; 100 is a suggested target.'},
{id:'sid',n:'Sayyid al-Istighfar',ar:'اللّٰهُمَّ أَنْتَ رَبِّي لَا إِلٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',tr:'Allāhumma anta rabbī lā ilāha illā anta, khalaqtanī wa anā ‘abduk…',en:'O Allah, You are my Lord; none has the right to be worshipped but You. You created me and I am Your servant… I admit my sins, so forgive me, for none forgives sins but You.',t:1,src:'Sahih al-Bukhari 6306',f:'Narrated as the master of seeking forgiveness, recited once with conviction in the morning or evening (Bukhari 6306).'}];
const K='noor-tasbih-v1',CIRC=2*Math.PI*100;
const def={id:'sub',counts:{},targets:{},starts:{},theme:'light',custom:[],hist:[],days:{},goal:100,fav:[],last:[],view:'home',ms:{}};
let S;try{S=Object.assign({},def,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=Object.assign({},def)}
if(S.theme!=='dark')S.theme='light';if(!['home','lib','prog','sett'].includes(S.view))S.view='home';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const fk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const all=()=>D.concat(S.custom),cur=()=>all().find(x=>x.id===S.id)||D[0],cnt=()=>S.counts[S.id]||0,tgt=()=>S.targets[S.id]??cur().t;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let open={};
function add(){const c=cnt(),nc=c+1;if(!S.starts[S.id])S.starts[S.id]=Date.now();S.counts[S.id]=nc;const k=fk(new Date());S.days[k]=(S.days[k]||0)+1;S.last.push({id:S.id,d:1});if(S.last.length>200)S.last.shift();save();const t=tgt();upd();
 if(t>0&&c<t&&nc>=t){try{navigator.vibrate&&navigator.vibrate([50,40,50])}catch(e){}modal('done')}}
function undo(){let i=-1;for(let j=S.last.length-1;j>=0;j--)if(S.last[j].id===S.id){i=j;break}if(i<0)return;const l=S.last.splice(i,1)[0];S.counts[S.id]=Math.max(0,cnt()-l.d);const k=fk(new Date());S.days[k]=Math.max(0,(S.days[k]||0)-l.d);save();upd()}
function streak(){let n=0,d=new Date();if(!(S.days[fk(d)]>0))d.setDate(d.getDate()-1);while(S.days[fk(d)]>0){n++;d.setDate(d.getDate()-1)}return n}
function upd(){const rg=document.getElementById('rg');if(!rg)return;const c=cnt(),t=tgt(),p=t>0?Math.min(1,c/t):(c%100)/100;rg.style.strokeDashoffset=CIRC*(1-p);document.getElementById('cn').textContent=c;document.getElementById('tg').textContent=t>0?(c>=t?'completed ✓':'of '+t):'no target'}
function modal(t){const m=document.getElementById('md');let h='';
 if(t==='done')h=`<div class="card"><h2>Round complete</h2><p class="ar" style="font-size:28px;margin:0">بارك الله فيك</p><p class="mut">${cnt()} of ${tgt()}. Nothing resets unless you choose.</p><div class="row"><button class="btn" data-a="newround">New round</button><button class="btn o" data-a="close">Keep counting</button></div></div>`;
 if(t==='reset')h=`<div class="card"><h2>Reset this count?</h2><p class="mut">${esc(cur().n)} will go back to zero. Your streak calendar is not affected.</p><div class="row"><button class="btn" data-a="doreset">Reset</button><button class="btn o" data-a="close">Cancel</button></div></div>`;
 m.innerHTML=h?`<div class="modal" role="dialog" aria-modal="true">${h}</div>`:''}
function home(){const d=cur(),t=tgt(),opts=[33,99,100,300,500,1000,0];if(!opts.includes(t))opts.unshift(t);
 return `<div id="zone" tabindex="0" aria-label="Tap anywhere to count">
 <select id="sel" class="pill" aria-label="Select dhikr">${all().map(x=>`<option value="${x.id}" ${x.id===S.id?'selected':''}>${esc(x.n)}</option>`).join('')}</select>
 <div class="ar" style="font-size:${d.ar.length>40?20:34}px">${esc(d.ar)}</div><div class="tr">${esc(d.tr)}</div><div class="en">${esc(d.en)}</div>
 <div class="ringw"><svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--pale)" stroke-width="3"/><circle id="rg" cx="110" cy="110" r="100" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}" transform="rotate(-90 110 110)"/></svg><div class="mid"><div id="cn" class="num">0</div><div id="tg" class="mut"></div></div></div>
 <div class="row"><button class="lnk" data-a="undo">Undo</button><select id="tsel" class="pill sm" aria-label="Target">${opts.map(n=>`<option value="${n}" ${t===n?'selected':''}>${n?'Target '+n:'No target'}</option>`).join('')}</select><button class="lnk" data-a="reset">Reset</button></div></div>`}
function lib(){return `<h2>Dhikr library</h2><input type="text" id="q" placeholder="Search dhikr" aria-label="Search" value="${esc(open.q||'')}">`+all().filter(d=>!open.q||(d.n+d.en+d.tr).toLowerCase().includes(open.q.toLowerCase())).map(d=>`<div class="card"><b>${esc(d.n)}</b> ${S.fav.includes(d.id)?'★':''}<div class="ar" style="font-size:22px">${esc(d.ar)}</div><div class="mut"><i>${esc(d.tr)}</i></div><div>${esc(d.en)}</div><div class="mut">${d.src?'Source: '+esc(d.src):'Custom dhikr'} · ${d.custom?'your target':'target '+d.t}</div>
 <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn" data-a="use" data-v="${d.id}">Count this</button><button class="btn o" data-a="fav" data-v="${d.id}">${S.fav.includes(d.id)?'Unfavourite':'Favourite'}</button>${d.f?`<button class="btn o" data-a="info" data-v="${d.id}">Virtue</button>`:''}${d.custom?`<button class="btn o" data-a="del" data-v="${d.id}">Delete</button>`:''}</div>${open[d.id]&&d.f?`<p>${esc(d.f)}</p><p class="mut">Always verify with a qualified scholar.</p>`:''}</div>`).join('')+
 `<div class="card"><b>Add custom dhikr</b><div style="height:8px"></div><input type="text" id="cn1" placeholder="Name"><div style="height:6px"></div><input type="text" id="ca" placeholder="Arabic (optional)"><div style="height:6px"></div><input type="number" id="ct" placeholder="Your target (optional)" min="1"><div style="height:10px"></div><button class="btn" data-a="addc">Save</button></div>`}
function tipFor(k){const v=S.days[k]||0;return new Date(k+'T00:00:00').toLocaleDateString([], {weekday:'short',day:'numeric',month:'long',year:'numeric'})+' · '+v+' dhikr'}
function prog(){const n=streak(),y=new Date().getFullYear(),a=new Date(y,0,1),b=new Date(y,11,31),td=fk(new Date());let c='<i class="e"></i>'.repeat(a.getDay());
 for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){const k=fk(d),v=S.days[k]||0;c+=`<i data-d="${k}" class="h${v>=100?3:v>=33?2:v>0?1:0}${k>td?' f':''}${k===td?' t':''}"></i>`}
 return `<h2>Progress</h2><div class="card" style="text-align:center"><div style="font-size:20px;margin-bottom:10px">${n?`🔥 ${n} day streak`:'Begin your streak today'}</div><div class="hmw" id="hmw"><div class="hm">${c}</div></div><div id="tip" class="mut" style="min-height:20px">${tipFor(td)}</div><div class="mut" style="margin-top:8px">Less <span class="leg"><i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i></span> More</div></div>`}
function sett(){return `<h2>Appearance</h2><div class="th">${[['light','Light','#FAF8F2'],['dark','Dark','#14201b']].map(([k,l,col])=>`<button class="${S.theme===k?'on':''}" data-a="theme" data-v="${k}"><span class="sw" style="background:${col}"></span>${l}</button>`).join('')}</div>`}
const V={home,lib,prog,sett},IC={home:'<circle cx="12" cy="12" r="8"/>',lib:'<path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3z"/>',prog:'<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>',sett:'<path d="M20 14a8 8 0 11-10-10 6 6 0 0010 10z"/>'};
const NAV=[['home','Count'],['lib','Library'],['prog','Progress'],['sett','Settings']];
function render(){document.documentElement.dataset.theme=S.theme;document.getElementById('app').innerHTML=V[S.view]();document.getElementById('nav').innerHTML=NAV.map(([k,l])=>`<button class="${S.view===k?'on':''}" data-a="go" data-v="${k}" ${S.view===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>${l}</button>`).join('');modal('');
 if(S.view==='home')requestAnimationFrame(()=>requestAnimationFrame(upd));
 if(S.view==='prog'){const w=document.getElementById('hmw'),n=new Date(),o=Math.floor((n-new Date(n.getFullYear(),0,1))/864e5);w.scrollLeft=Math.max(0,Math.floor((o+new Date(n.getFullYear(),0,1).getDay())/7)*16-w.clientWidth/2)}}
document.addEventListener('click',e=>{const t=e.target;
 const dd=t.closest('[data-d]');if(dd){document.getElementById('tip').textContent=tipFor(dd.dataset.d);return}
 const b=t.closest('[data-a]');
 if(b){const a=b.dataset.a,v=b.dataset.v,A={go:()=>{S.view=v;save();render()},undo,reset:()=>modal('reset'),close:()=>modal(''),doreset:()=>{S.counts[S.id]=0;S.starts[S.id]=0;S.last=S.last.filter(x=>x.id!==S.id);save();render()},newround:()=>{S.counts[S.id]=0;S.starts[S.id]=0;save();render()},
 use:()=>{S.id=v;S.view='home';save();render()},fav:()=>{S.fav=S.fav.includes(v)?S.fav.filter(x=>x!==v):S.fav.concat(v);save();render()},info:()=>{open[v]=!open[v];render()},
 del:()=>{S.custom=S.custom.filter(x=>x.id!==v);if(S.id===v)S.id='sub';save();render()},
 addc:()=>{const n=document.getElementById('cn1').value.trim();if(!n)return;const g=parseInt(document.getElementById('ct').value)||0;S.custom.push({id:'c'+Date.now(),n,ar:document.getElementById('ca').value.trim(),tr:'',en:'',t:g,custom:1});save();render()},
 theme:()=>{S.theme=v;save();render()}};A[a]&&A[a]();return}
 if(t.closest('button,input,select,a,label,textarea,.modal'))return;
 if(t.closest('#zone'))add()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='sel'){S.id=t.value;save();render()}else if(t.id==='tsel'){S.targets[S.id]=+t.value;save();render()}});
document.addEventListener('mouseover',e=>{const d=e.target.closest&&e.target.closest('[data-d]');const p=document.getElementById('tip');if(d&&p)p.textContent=tipFor(d.dataset.d)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){open.q=t.value;const p=t.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(S.view!=='home'||document.querySelector('.modal')||/INPUT|SELECT|BUTTON|TEXTAREA/.test(e.target.tagName))return;if([' ','Enter','ArrowRight'].includes(e.key)){e.preventDefault();add()}});
save();render();
</script></body></html>
